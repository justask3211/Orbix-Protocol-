[profile.default]
src = "src"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "read-write", path = "./center/deployments" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "@layerzerolabs/oft-evm/=node_modules/@layerzerolabs/oft-evm/", "@layerzerolabs/oapp-evm/=node_modules/@layerzerolabs/oapp-evm/", "@layerzerolabs/lz-evm-protocol-v2/=node_modules/@layerzerolabs/lz-evm-protocol-v2/", "@layerzerolabs/lz-evm-messagelib-v2/=node_modules/@layerzerolabs/lz-evm-messagelib-v2/", "solidity-bytes-utils/=node_modules/solidity-bytes-utils/"]
