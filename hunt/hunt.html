<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbix 666 — Human Hunt</title>
<style>
  :root{--bg:#0b0d12;--card:#141824;--acc:#7c5cff;--txt:#e8eaf2;--dim:#8b91a8}
  *{box-sizing:border-box;margin:0;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px}
  h1{font-size:28px;margin-bottom:6px}h1 span{color:var(--acc)}
  p.sub{color:var(--dim);margin-bottom:28px;text-align:center}
  #screen{background:var(--card);border:1px solid #222840;border-radius:20px;padding:36px 28px;width:340px;text-align:center}
  #digits{font-size:44px;font-weight:800;letter-spacing:8px;font-family:monospace;margin:18px 0;min-height:56px}
  .btn{width:100%;padding:15px;margin-top:14px;border:0;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;color:#fff}
  #roll{background:linear-gradient(135deg,var(--acc),#4f8cff)}
  #claim{background:linear-gradient(135deg,#2ecc71,#1abc9c);display:none}
  #attempts{color:var(--dim);font-size:13px;margin-top:14px}
  #msg{margin-top:16px;font-size:14px;min-height:20px;color:var(--acc)}
  .win{color:#2ecc71 !important;animation:pulse .6s ease infinite alternate}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}
</style>
</head>
<body>
<h1>Orbix <span>666</span> — Human Hunt</h1>
<p class="sub">222 mints for humans only. Roll the dice — hit a winning 6-digit number and the server signs your claim.<br>Same energy as the number hunts you know. No bots.</p>
<div id="screen">
  <div style="color:var(--dim);font-size:13px">YOUR NUMBER</div>
  <div id="digits">······</div>
  <button class="btn" id="roll">🎲 Roll</button>
  <button class="btn" id="claim">Mint on-chain →</button>
  <div id="attempts">0 rolls</div>
  <div id="msg"></div>
</div>
<script>
let n = 0, attempts = 0, winData = null, account = null;
const $ = s => document.querySelector(s);

async function connect(){
  if (!window.ethereum) return alert('Install MetaMask/Rabby');
  await window.ethereum.request({method:'wallet_addEthereumChain', params:[{chainId:'0xb626', chainName:'Robinhood Chain Testnet', nativeCurrency:{name:'Ether',symbol:'ETH',decimals:18}, rpcUrls:['https://rpc.testnet.chain.robinhood.com'], blockExplorerUrls:['https://explorer.testnet.chain.robinhood.com']}]}).catch(()=>{});
  account = (await window.ethereum.request({method:'eth_requestAccounts'}))[0];
  $('#msg').textContent = 'Wallet: '+account.slice(0,6)+'…'+account.slice(-4);
}

function roll(){
  n = Math.floor(111111 + Math.random() * (999999 - 111111));
  attempts++;
  $('#digits').textContent = n;
  $('#attempts').textContent = attempts + ' rolls';
  $('#claim').style.display = 'none';
  fetch('/check', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({number:n, address:account})})
  .then(r=>r.json()).then(d=>{
    if (d.winner) {
      winData = d;
      $('#digits').classList.add('win');
      $('#msg').textContent = '🎉 WINNER! Server signed your claim.';
      $('#claim').style.display = 'block';
    }
  }).catch(()=>{});
}

async function mint(){
  if (!winData) return;
  const provider = new ethers.BrowserProvider(window.ethereum);
  const signer = await provider.getSigner();
  const c = new ethers.Contract(winData.contract, [
    'function mintHuman(uint256,uint256,bytes32,bytes)'], signer);
  try {
    const tx = await c.mintHuman(winData.luckyNumber, winData.timestamp, winData.seed, winData.signature);
    $('#msg').textContent = 'Mint sent: '+tx.hash.slice(0,18)+'…';
    await tx.wait();
    $('#msg').textContent = '✅ Minted! You hold an Orbix 666.';
  } catch(e){ $('#msg').textContent = '❌ '+e.message.slice(0,100); }
}

$('#roll').onclick = () => { if (!account) connect(); roll(); };
$('#claim').onclick = mint;
</script>
</body>
</html>
