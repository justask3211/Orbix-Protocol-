name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install LayerZero npm contracts (remappings resolve into node_modules)
        run: |
          npm init -y >/dev/null
          npm install --no-save \
            @layerzerolabs/oft-evm@4.0.1 \
            @layerzerolabs/oapp-evm@0.4.1 \
            @layerzerolabs/lz-evm-protocol-v2@3.0.168 \
            @layerzerolabs/lz-evm-messagelib-v2@3.0.168 \
            solidity-bytes-utils@0.8.4

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv
